services:
  - type: web
    name: learnity-fullstack
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: OWNER_NAME
        value: Learnity Platform Owner
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
